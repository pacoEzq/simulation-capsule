name: validate
# Every capsule in examples/ is checked on every push. A reader found the
# trailing comma in the jet capsule during the Part 4 probe test, named it as
# the one packaging change worth making, and the capsule shipped with it
# anyway. This workflow is the difference between finding a defect and
# enforcing one.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  capsules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The validator has to prove it can still fail before its passes mean
      # anything. This asserts the jet regression and that all fourteen checks
      # fire on at least one fixture.
      - name: Self test the validator
        run: python3 tools/test_check_capsule.py
      # A capsule linked from a published post does not change, not a byte.
      # This is the rule that makes examples/as-published/ a record rather
      # than a copy nobody is watching.
      - name: Frozen tree intact
        run: python3 tools/check_frozen.py examples/frozen.sha256
      # The published capsules predate SPEC 0.2, so their reference quantities
      # warn and that is the point: the warnings are the migration inventory
      # Part 7 works from. Never --strict here.
      - name: Published capsules
        run: |
          set -o pipefail
          python3 tools/check_capsule.py examples/as-published/capsule_*/ \
            | tee validation_as_published.txt
      # The migrated capsules, under --strict: the reference block is now one
      # form, so a legacy warning here is a regression, not inherited debt.
      - name: Current capsules
        run: |
          set -o pipefail
          python3 tools/check_capsule.py examples/capsule_*/ --strict | tee validation.txt
      # Informational for now. Add --fail-over 60000 once Part 7 settles
      # whether one capsule may carry both spatial layers at full resolution.
      - name: Measure the token cost
        if: always()
        run: python3 tools/capsule_ledger.py examples/capsule_*/ --markdown > ledger.md
      - name: Publish the report
        if: always()
        run: |
          {
            echo "## Capsule validation"
            echo ""
            echo '```'
            cat validation.txt 2>/dev/null || echo "validation did not run"
            echo '```'
            echo ""
            echo "## Published capsules, frozen"
            echo ""
            echo '```'
            cat validation_as_published.txt 2>/dev/null || echo "did not run"
            echo '```'
            echo ""
            cat ledger.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
