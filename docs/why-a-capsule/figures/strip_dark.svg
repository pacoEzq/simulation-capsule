<text x="430" y="51" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="450" y="51" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efec" text-anchor="start">Answer</text>
<text x="418" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">a value and an interval;</text>
<text x="418" y="102" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">expected answers unseen</text>
<line x1="578" y1="75" x2="588" y2="75" stroke="#8f8e86" stroke-width="2"/><polygon points="595,75 586,70 586,80" fill="#8f8e86"/>
