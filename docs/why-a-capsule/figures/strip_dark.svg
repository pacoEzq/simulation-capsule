<text x="66" y="51" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efec" text-anchor="start">Freeze the kit</text>
<text x="34" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">sha256 of each file,</text>
<text x="34" y="102" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">before any reader runs</text>
<line x1="194" y1="75" x2="204" y2="75" stroke="#8f8e86" stroke-width="2"/><polygon points="211,75 202,70 202,80" fill="#8f8e86"/>
