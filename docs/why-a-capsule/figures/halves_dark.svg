<text x="490" y="272" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">Without the lower path, the model writes a simulation and never sees what came out.</text>
