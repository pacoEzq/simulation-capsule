<text x="38" y="100" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">36 of 36</text>
<text x="38" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">samples of a time history</text>
<text x="38" y="150" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">the capsule does not store,</text>
<text x="38" y="168" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">rebuilt within 1% of the swing</text>
<text x="38" y="206" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">probe 8b</text>
<rect x="260" y="16" width="220" height="208" rx="10" fill="#f1f0ec" stroke="#d6d4cd" stroke-width="1"/>
