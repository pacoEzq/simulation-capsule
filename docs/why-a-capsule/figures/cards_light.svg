<text x="278" y="52" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#52514e" text-anchor="start">AUDIT</text>
<text x="278" y="100" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">1.068</text>
<text x="278" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">the stagnation value, found</text>
<text x="278" y="150" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">behind a label that reads</text>
<text x="278" y="168" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">2.394</text>
<text x="278" y="206" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">probe 7c</text>
<rect x="500" y="16" width="220" height="208" rx="10" fill="#f1f0ec" stroke="#d6d4cd" stroke-width="1"/>
<rect x="500" y="16" width="220" height="6" rx="3" fill="#2a78d6"/>
<text x="518" y="52" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#52514e" text-anchor="start">QUESTION</text>
<text x="518" y="100" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">5,000</text>
<text x="518" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">iterations, predicted before</text>
<text x="518" y="150" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">the run started; interpolation</text>
<text x="518" y="168" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">gives 9,243</text>
<text x="518" y="206" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">probe 7a</text>
