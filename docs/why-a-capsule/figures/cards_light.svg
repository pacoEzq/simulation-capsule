<text x="758" y="52" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#52514e" text-anchor="start">DECLINE</text>
<text x="758" y="100" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">4 of 4</text>
<text x="758" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">questions the files cannot</text>
<text x="758" y="150" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">answer, refused by both</text>
<text x="758" y="168" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">readers</text>
<text x="758" y="206" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">probe 6b</text>
